app = "ram-catalog-backend"
primary_region = "iad"
swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile.backend"

[env]
  PORT = "8000"
  CORS_ORIGINS = "https://swipswaps.github.io,http://localhost:5173"
  DB_PATH = "/app/ram_catalog.db"

[deploy]
  wait_timeout = "10m"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2048mb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "120s"
  method = "GET"
  path = "/health"

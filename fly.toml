app = "ram-catalog-backend"
primary_region = "iad"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile.backend"

[env]
  PORT = "8000"
  CORS_ORIGINS = "https://swipswaps.github.io,http://localhost:5173"
  DB_PATH = "/app/ram_catalog.db"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[http_service]
  min_machines_running = 1
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[deploy]
  wait_timeout = "5m"

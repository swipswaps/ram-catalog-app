services:
  ram-catalog-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ram_catalog_backend
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=https://swipswaps.github.io,http://localhost:5173,http://localhost:4173
      - DB_PATH=/app/ram_catalog.db
    volumes:
      - cad_data:/app/static/cad
      - db_data:/app
    restart: unless-stopped

volumes:
  cad_data:
  db_data:
